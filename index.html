<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#05060A">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Winter Arc">
<link rel="icon" type="image/png" href="/favicon.png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<title>Winter Arc</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:ital,wdth,wght@0,62..125,400..900;1,62..125,400..900&family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500;600&display=swap">
<link rel="stylesheet" href="/css/app.css?v=4">
</head>
<body data-view="heute">
<div class="stage-glow" aria-hidden="true"></div>
<canvas id="stage" aria-hidden="true"></canvas>

<header class="topbar" id="topbar">
  <a class="brand" href="#heute" aria-label="Winter Arc, zu Heute"><img src="/apple-touch-icon.png" alt=""><b>Winter Arc</b><span id="arcTag"></span></a>
  <span class="status"><span class="led" id="led"></span><span id="liveText">Lädt</span></span>
</header>

<nav class="tabbar" aria-label="Bereiche">
  <button class="tab" type="button" data-v="heute"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="8.5"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1.5"/></svg>Heute</button>
  <button class="tab" type="button" data-v="woche"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3.5" y="5" width="17" height="15.5" rx="3"/><path d="M3.5 10h17M8 3v4M16 3v4"/></svg>Woche</button>
  <button class="tab" type="button" data-v="rad"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="5.5" cy="16" r="3.8"/><circle cx="18.5" cy="16" r="3.8"/><path d="M5.5 16l4.2-7.5h6.5L18.5 16M9.7 8.5l3.3 7.5h-7.5M8.5 6h3"/></svg>Rad</button>
  <button class="tab" type="button" data-v="kraft"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2.5 12h19M5.5 8.5v7M8.5 6.5v11M15.5 6.5v11M18.5 8.5v7"/></svg>Kraft</button>
  <button class="tab" type="button" data-v="erfolge"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 4h8v5.5a4 4 0 0 1-8 0zM8 6H5a3 3 0 0 0 3 4M16 6h3a3 3 0 0 1-3 4M12 13.5v4M8.5 20.5h7"/></svg>Erfolge</button>
</nav>

<main id="main">
  <div class="hero" id="hero"></div>
  <div class="notice" id="notice" hidden></div>
  <div class="content" id="content"></div>
</main>

<div class="scrim" id="scrim" hidden><div class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle" id="sheet"></div></div>
<div class="toast" id="toast" role="status" hidden></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="/js/logic.js?v=4"></script>
<script src="/js/stage.js?v=4"></script>
<script src="/js/app.js?v=4"></script>
</body>
</html>
